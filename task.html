<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a task</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<header class="hero"><div class="wrap">
  <h1>Add a task</h1>
  <p>Straight onto your Morning Desk. It appears at the next refresh.</p>
  <div class="nav"><a href="admin.html">Availability</a><a class="on" href="task.html">Add a task</a></div>
</div></header>
<main class="wrap">
  <div id="fatal" class="card hide"><p class="err" id="fatalmsg"></p></div>
  <form id="form" class="card" novalidate>
    <div class="field"><label for="t">What needs doing? *</label><textarea id="t" placeholder="e.g. Ring the venue about dietary needs" autofocus></textarea></div>
    <div class="field"><label>Which list?</label>
      <div class="chips" id="list"><button type="button" class="chip on" data-v="Work (Hammer and Pen)">Hammer and Pen</button><button type="button" class="chip" data-v="Work (Heres Law)">Heres Law</button><button type="button" class="chip" data-v="Personal">Personal</button></div></div>
    <div class="field"><label>When?</label>
      <div class="chips" id="when"><button type="button" class="chip on" data-d="today">Today</button><button type="button" class="chip" data-d="tomorrow">Tomorrow</button><button type="button" class="chip" data-d="friday">This Friday</button><button type="button" class="chip" data-d="monday">Next Monday</button><button type="button" class="chip" data-d="none">No date</button></div>
      <input type="date" id="due" style="margin-top:10px;max-width:220px" aria-label="Or pick a date"></div>
    <div class="field"><label>How urgent?</label>
      <div class="chips" id="urg"><button type="button" class="chip" data-v="Urgent (this week)">Urgent</button><button type="button" class="chip on" data-v="Normal">Normal</button><button type="button" class="chip" data-v="No rush">No rush</button></div></div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" class="btn gold block" id="go">Add to my Morning Desk</button>
  </form>
  <section class="card"><h2>Added recently</h2><div class="list" id="recent"><span class="muted small">Loading…</span></div></section>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
(function () {
  var D = window.Desk, $ = D.$, h = D.h, key = D.key(), st = { list: 'Work (Hammer and Pen)', urg: 'Normal', when: 'today' };
  function A() { return D.api.apply(null, [arguments[0], key].concat([].slice.call(arguments, 1))); }
  function pick(sel, set) { $(sel).addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; D.$$(sel + ' .chip').forEach(function (x) { x.classList.toggle('on', x === b); }); set(b); }); }
  pick('#list', function (b) { st.list = b.dataset.v; }); pick('#urg', function (b) { st.urg = b.dataset.v; });
  pick('#when', function (b) { st.when = b.dataset.d; $('#due').value = ''; });
  $('#due').addEventListener('change', function () { D.$$('#when .chip').forEach(function (x) { x.classList.remove('on'); }); st.when = 'date'; });
  function dueDate() {
    var t = D.todayStr(), wd = D.weekday(t);
    if (st.when === 'today') return t; if (st.when === 'tomorrow') return D.addDays(t, 1);
    if (st.when === 'friday') return D.addDays(t, (5 - wd + 7) % 7); if (st.when === 'monday') return D.addDays(t, 8 - wd);
    if (st.when === 'date') return $('#due').value; return '';
  }
  function recent() {
    A('adminGet').then(function (s) {
      $('#recent').innerHTML = s.tasks.length ? s.tasks.map(function (t) { return '<div><div><strong>' + h(t.title) + '</strong><div class="small muted">' + h(t.list) + (t.due ? ' · due ' + h(D.label(t.due)) : '') + ' · ' + h(t.urgency) + '</div></div></div>'; }).join('') : '<span class="muted small">Nothing yet.</span>';
    }).catch(function (e) { $('#fatal').classList.remove('hide'); $('#fatalmsg').textContent = e.message; });
  }
  $('#form').addEventListener('submit', function (e) {
    e.preventDefault(); var btn = $('#go'), err = $('#err'); err.textContent = ''; D.busy(btn, true, 'Adding…');
    A('adminAddTask', { title: $('#t').value, list: st.list, due: dueDate(), urgency: st.urg }).then(function () { D.busy(btn, false); $('#t').value = ''; D.toast('Added to your Morning Desk'); $('#t').focus(); recent(); })
      .catch(function (x) { D.busy(btn, false); err.textContent = x.message; });
  });
  if (!key) { $('#fatal').classList.remove('hide'); $('#fatalmsg').textContent = 'This page needs your private link.'; } else recent();
})();
</script>
</body></html>
